# ─────────────────────────────────────────────────────────────────
#  Render Blueprint: Zippr Ride-Hailing Platform
#  Docs: https://render.com/docs/blueprint-spec
# ─────────────────────────────────────────────────────────────────

services:
  # ── 1. Backend Web Service (FastAPI + Async SQLAlchemy) ────────
  - type: web
    name: zippr-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && python -m app.db.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DATABASE_URL
        fromDatabase:
          name: zippr-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: zippr-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: "*"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"

  # ── 2. Frontend Static Site (React 18 + Vite) ───────────────────
  - type: web
    name: zippr-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Set these to your backend URL after the backend service is created:
      # e.g. https://zippr-backend.onrender.com
      - key: VITE_API_URL
        sync: false
      # e.g. wss://zippr-backend.onrender.com
      - key: VITE_WS_URL
        sync: false

  # ── 3. Managed Key-Value Store (Redis-compatible) ──────────────
  - type: keyvalue
    name: zippr-redis
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere

databases:
  # ── 4. Managed PostgreSQL 16 Database ──────────────────────────
  - name: zippr-db
    databaseName: zipprdb
    user: zippr
    plan: free

